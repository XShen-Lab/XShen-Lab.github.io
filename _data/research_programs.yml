en:
  - key: organization
    operation: Organization
    title: Genome Organization
    question: How does genome sequence encode nuclear organization?
    description: We investigate how genome sequences, repetitive elements and their RNA products establish nuclear architecture, spatial positioning and genome regulation.
    anchor: genome-organization
    motif: domain
  - key: processing
    operation: Processing
    title: RNA Networks
    question: How does RNA organize the nuclear environment?
    description: We study how nascent RNA, RNA-binding proteins and processing factors form an RNA–RBP meshwork that coordinates genome function.
    anchor: rna-networks
    motif: mesh
  - key: selection
    operation: Selection
    title: Transcriptional Surveillance
    question: How does productive information emerge from pervasive transcription?
    description: We examine how RNA Polymerase II, RNA processing and degradation pathways support productive elongation, RNA maturation and polymerase recycling.
    anchor: transcriptional-surveillance
    motif: checkpoint
  - key: stabilization
    operation: Stabilization
    title: Cell Fate Dynamics
    question: How do probabilistic genome activities generate stable cell identity?
    description: We measure and model how sparse, stochastic genome activity is coordinated across individual cells and stabilized across populations.
    anchor: cell-fate-dynamics
    motif: field

zh-CN:
  - key: organization
    operation: 组织化
    operation_en: Organization
    title: 基因组组织
    question: 基因组序列如何编码细胞核结构？
    description: 我们研究基因组序列、重复元件及其 RNA 产物如何建立细胞核结构、空间定位与基因组调控。
    anchor: genome-organization
    motif: domain
  - key: processing
    operation: 处理
    operation_en: Processing
    title: RNA 网络
    question: RNA 如何组织细胞核环境？
    description: 我们研究新生 RNA、RNA 结合蛋白与加工因子如何形成协调基因组功能的 RNA–RBP 网状体系。
    anchor: rna-networks
    motif: mesh
  - key: selection
    operation: 选择
    operation_en: Selection
    title: 转录监控
    question: 有效生物信息如何从广泛转录中产生？
    description: 我们研究 RNA 聚合酶 II、RNA 加工和降解通路如何支持有效延伸、RNA 成熟与聚合酶循环利用。
    anchor: transcriptional-surveillance
    motif: checkpoint
  - key: stabilization
    operation: 稳定化
    operation_en: Stabilization
    title: 细胞命运动力学
    question: 概率性基因组活动如何产生稳定的细胞身份？
    description: 我们测量并建模稀疏、随机的基因组活动如何在单细胞间协调，并在细胞群体中得到稳定化。
    anchor: cell-fate-dynamics
    motif: field
