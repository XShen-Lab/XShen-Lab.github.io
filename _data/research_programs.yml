en:
  - key: organization
    operation: Organization
    operation_verb: Organizing Biological Information
    title: Genome Organization
    question: How does genome sequence encode nuclear organization?
    description: We investigate how genome sequences, repetitive elements and their RNA products establish nuclear architecture, spatial positioning and genome regulation.
    overview: >-
      Genome sequence encodes more than genes. We investigate how repetitive elements—including L1 and B1/Alu sequences—establish principles of chromosome compartmentalization and nuclear positioning, and how their RNA products participate in chromatin organization.
    outlook: >-
      We are extending this framework to understand genome partitioning and remodeling during development, cell-cycle transitions and changes in cell fate.
    focus:
      - Repetitive elements and their RNA products
      - Chromosome compartmentalization and nuclear positioning
      - Dynamic genome remodeling across cellular transitions
    anchor: genome-organization
    motif: domain
  - key: processing
    operation: Processing
    operation_verb: Processing Biological Information
    title: RNA Networks
    question: How does RNA organize the nuclear environment?
    description: We study how nascent RNA, RNA-binding proteins and processing factors form an RNA–RBP meshwork that coordinates genome function.
    overview: >-
      RNA is both a carrier of genetic information and a material organizer of nuclear function. Noncoding RNAs regulate neighboring genes and local chromatin states, while RNA-binding proteins form dynamic RNA-associated condensates that influence RNA Polymerase II recruitment, CTD phosphorylation and elongation.
    outlook: >-
      We investigate how nascent RNA, RNA-binding proteins and processing factors assemble an RNA–RBP meshwork that coordinates transcription, RNA maturation, RNA degradation and nuclear organization.
    focus:
      - Nascent RNA and RNA-binding proteins
      - RNA-associated condensates and Pol II regulation
      - Coupling of transcription, processing and nuclear architecture
    image:
      path: /images/research/rna-chromatin-dstorm.png
      home_path: /images/research/rna-chromatin-dstorm-thumb.png
      alt: Super-resolution image showing interwoven EU-labeled RNA and H3-marked chromatin in a nucleus
      caption: Super-resolution view of spatially interwoven RNA and chromatin.
    anchor: rna-networks
    motif: mesh
  - key: selection
    operation: Selection
    operation_verb: Selecting Biological Information
    title: Transcriptional Surveillance
    question: How does productive information emerge from pervasive transcription?
    description: We examine how RNA Polymerase II, RNA processing and degradation pathways support productive elongation, RNA maturation and polymerase recycling.
    overview: >-
      Eukaryotic genomes are extensively transcribed, yet only a fraction of transcriptional events achieve productive elongation and generate mature mRNAs. We therefore treat productive transcription as an actively established state rather than a default outcome.
    outlook: >-
      Our work examines how the RNA Polymerase II CTD, EIF4A3, RNA processing and degradation pathways form a genome-scale surveillance system that clears nonproductive transcription while supporting RNA maturation, productive elongation and polymerase recycling.
    focus:
      - RNA Polymerase II CTD and EIF4A3
      - Kinetic selection of productive elongation
      - RNA maturation, clearance and polymerase recycling
    anchor: transcriptional-surveillance
    motif: checkpoint
  - key: stabilization
    operation: Stabilization
    operation_verb: Stabilizing Biological Information
    title: Cell Fate Dynamics
    question: How do probabilistic genome activities generate stable cell identity?
    description: We measure and model how sparse, stochastic genome activity is coordinated across individual cells and stabilized across populations.
    overview: >-
      Stable identity need not require every cell to execute an identical transcriptional program. With scFLUENT-seq, developed in our laboratory, we obtain a short-pulse snapshot of nascent genome usage at single-cell resolution.
    outlook: >-
      Individual cells use a cell-type-dependent fraction of approximately 0.02%–3.1% of the genome at a given moment, while populations explore broader genomic landscapes. We model cellular identity as a stable probability distribution emerging from coordinated stochastic activity.
    metric: 0.02%–3.1%
    metric_label: Cell-type-dependent fraction of the genome used by an individual cell at a given moment
    focus:
      - scFLUENT-seq and single-cell nascent RNA
      - Short-pulse readout of nascent genome usage
      - Statistical and kinetic models of stable cell states
    image:
      path: /images/publications/2025-scfluent-seq/graphical-abstract.webp
      home_path: /images/publications/2025-scfluent-seq/graphical-abstract.webp
      alt: scFLUENT-seq graphical abstract showing nascent RNA measurement across individual cells
      caption: scFLUENT-seq connects short-pulse nascent RNA measurements to probabilistic genome activity.
    anchor: cell-fate-dynamics
    motif: field

zh-CN:
  - key: organization
    operation: 组织化
    operation_en: Organization
    operation_verb: 组织生物信息
    title: 基因组组织
    question: 基因组序列如何编码细胞核结构？
    description: 我们研究基因组序列、重复元件及其 RNA 产物如何建立细胞核结构、空间定位与基因组调控。
    overview: >-
      基因组序列编码的不只是基因。我们研究 L1 与 B1/Alu 等重复元件如何建立染色体区室化和核内定位原则，以及这些元件的 RNA 产物如何参与染色质组织。
    outlook: >-
      我们正在将这一框架拓展至发育、细胞周期转换和细胞命运变化过程中的基因组分区与动态重塑。
    focus:
      - 重复元件及其 RNA 产物
      - 染色体区室化与核内定位
      - 细胞状态转换中的动态基因组重塑
    anchor: genome-organization
    motif: domain
  - key: processing
    operation: 处理
    operation_en: Processing
    operation_verb: 处理生物信息
    title: RNA 网络
    question: RNA 如何组织细胞核环境？
    description: 我们研究新生 RNA、RNA 结合蛋白与加工因子如何形成协调基因组功能的 RNA–RBP 网状体系。
    overview: >-
      RNA 既是遗传信息载体，也是组织细胞核功能的物质基础。非编码 RNA 能够调控邻近基因与局部染色质状态；RNA 结合蛋白形成动态的 RNA 相关凝聚体，并影响 RNA 聚合酶 II 的募集、CTD 磷酸化与转录延伸。
    outlook: >-
      我们研究新生 RNA、RNA 结合蛋白与加工因子如何组装为 RNA–RBP 网状体系，并协调转录、RNA 成熟、RNA 降解与细胞核组织。
    focus:
      - 新生 RNA 与 RNA 结合蛋白
      - RNA 相关凝聚体与 RNA 聚合酶 II 调控
      - 转录、RNA 处理与细胞核结构的耦联
    image:
      path: /images/research/rna-chromatin-dstorm.png
      home_path: /images/research/rna-chromatin-dstorm-thumb.png
      alt: 超分辨成像显示细胞核内 EU 标记 RNA 与 H3 标记染色质相互交织
      caption: 超分辨视野中的 RNA 与染色质空间交织。
    anchor: rna-networks
    motif: mesh
  - key: selection
    operation: 选择
    operation_en: Selection
    operation_verb: 选择生物信息
    title: 转录监控
    question: 有效生物信息如何从广泛转录中产生？
    description: 我们研究 RNA 聚合酶 II、RNA 加工和降解通路如何支持有效延伸、RNA 成熟与聚合酶循环利用。
    overview: >-
      真核基因组发生广泛转录，但只有部分转录事件能够进入有效延伸并形成成熟 mRNA。因此，我们将有效转录视为一种需要被主动建立的状态，而非默认结果。
    outlook: >-
      我们研究 RNA 聚合酶 II CTD、EIF4A3、RNA 处理与降解通路如何构成全基因组尺度的转录监控系统：清除无效转录，同时支持 RNA 成熟、有效延伸与聚合酶循环利用。
    focus:
      - RNA 聚合酶 II CTD 与 EIF4A3
      - 有效转录延伸的动力学选择
      - RNA 成熟、清除与聚合酶循环利用
    anchor: transcriptional-surveillance
    motif: checkpoint
  - key: stabilization
    operation: 稳定化
    operation_en: Stabilization
    operation_verb: 稳定生物信息
    title: 细胞命运动力学
    question: 概率性基因组活动如何产生稳定的细胞身份？
    description: 我们测量并建模稀疏、随机的基因组活动如何在单细胞间协调，并在细胞群体中得到稳定化。
    overview: >-
      稳定的细胞身份并不要求每个细胞执行完全相同的转录程序。利用本实验室开发的 scFLUENT-seq，我们在单细胞分辨率下获得短时脉冲标记的新生基因组使用快照。
    outlook: >-
      单个细胞在特定时刻使用约 0.02%–3.1% 的基因组，具体范围取决于细胞类型；细胞群体则探索更广泛的基因组空间。我们将细胞身份建模为由协调的随机活动产生的稳定概率分布。
    metric: 0.02%–3.1%
    metric_label: 单个细胞在特定时刻使用的基因组比例，范围取决于细胞类型
    focus:
      - scFLUENT-seq 与单细胞新生 RNA
      - 新生基因组使用的短时脉冲读出
      - 稳定细胞状态的统计与动力学模型
    image:
      path: /images/publications/2025-scfluent-seq/graphical-abstract.webp
      home_path: /images/publications/2025-scfluent-seq/graphical-abstract.webp
      alt: scFLUENT-seq 图形摘要，展示在单细胞尺度测量新生 RNA
      caption: scFLUENT-seq 将短时脉冲标记的新生 RNA 测量与概率性基因组活动相连接。
    anchor: cell-fate-dynamics
    motif: field
