categories:
  - id: genome-organization
    label:
      en: Genome Organization
      zh-CN: 基因组组织
    title:
      en: Genome organization and spatial encoding of biological information
      zh-CN: 基因组组织与生物信息的空间编码
    description:
      en: >-
        Repetitive elements are not inert genomic material: their sequence identities contribute to homotypic clustering, chromatin compartmentalization, and coordinated regulation, establishing a spatial layer of biological information.
      zh-CN: >-
        重复元件并非惰性的基因组材料；其序列特征参与同类聚集、染色质区室化与协调调控，构成生物信息的空间层次。
  - id: rna-networks
    label:
      en: RNA Networks
      zh-CN: RNA 网络
    title:
      en: RNA meshwork and nuclear information-processing environments
      zh-CN: RNA 网状体系与细胞核信息处理环境
    description:
      en: >-
        The laboratory established genomic proximity as a principle of lncRNA-mediated cis regulation and revealed that nascent RNA and RNA-binding proteins organize transcriptional machinery, chromatin association, and nuclear environments through phase separation and RNA homeostasis.
      zh-CN: >-
        实验室确立了基因组邻近性作为 lncRNA 顺式调控原则，并揭示新生 RNA 和 RNA 结合蛋白通过相分离与 RNA 稳态组织转录机器、染色质关联和细胞核环境。
  - id: transcriptional-surveillance
    label:
      en: Transcriptional Surveillance
      zh-CN: 转录监控
    title:
      en: Transcriptional surveillance and selection of productive biological information
      zh-CN: 转录监控与有效生物信息选择
    description:
      en: >-
        Ongoing studies examine how RNA Polymerase II activity, RNA processing, RNA degradation, and quality control select productive outputs from pervasive genome activity. The CV identifies these studies as unpublished and does not identify a formal published paper for this contribution; their manuscript titles are therefore omitted.
      zh-CN: >-
        正在开展的研究关注 RNA 聚合酶 II 活性、RNA 加工、RNA 降解和质量控制如何从广泛基因组活动中选择有效输出。简历将这些研究标注为未发表，且未在该贡献项下列出正式发表论文，因此不公开相关稿件标题。
  - id: cell-fate-dynamics
    label:
      en: Cell Fate Dynamics
      zh-CN: 细胞命运动力学
    title:
      en: Probabilistic genome activity and stabilization of cell fate
      zh-CN: 概率性基因组活动与细胞命运稳定化
    description:
      en: >-
        scFLUENT-seq revealed that genome activity in individual cells is sparse and probabilistic. The publication reports a cell-type-dependent range of approximately 0.02%–3.1% of the genome transcribed per cell, supporting a model in which stable cellular identities emerge through statistical stabilization of stochastic transcription.
      zh-CN: >-
        scFLUENT-seq 揭示了单细胞基因组活动的稀疏性和概率性。论文报告每个细胞转录约 0.02%–3.1% 的基因组，范围取决于细胞类型，支持稳定细胞身份由随机转录的统计性稳定产生这一模型。
  - id: foundations
    label:
      en: Foundations
      zh-CN: 基础研究
    title:
      en: Foundations in stress signaling and epigenetic regulation of cell fate
      zh-CN: 应激信号与细胞命运表观遗传调控基础
    description:
      en: >-
        Earlier work defined conserved mechanisms of the unfolded protein response and identified Polycomb regulators that balance stem-cell self-renewal and differentiation, providing foundations for the laboratory’s current cell-fate questions.
      zh-CN: >-
        早期研究阐明了保守的未折叠蛋白反应机制，并鉴定出调控干细胞自我更新与分化平衡的 Polycomb 调控因子，为实验室当前的细胞命运问题奠定基础。
  - id: other
    label:
      en: Other
      zh-CN: 其他
    title:
      en: Other publications
      zh-CN: 其他论文
    description:
      en: >-
        Formal records not assigned to one of the five current research programs.
      zh-CN: >-
        尚未归入五个当前研究方向的正式记录。

