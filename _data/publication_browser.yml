        zh-CN: 图 7 · JMJ 与 PRC2 相互作用模型
  - publication_id: pub-cv-043
    category: foundations
    title: EZH1 mediates methylation on histone H3 lysine 27 and complements EZH2 in maintaining stem cell identity and executing pluripotency
    venue: Molecular Cell
    year: 2008
    summary:
      en: EZH1 and EZH2 provide complementary but nonredundant H3K27 methylation activities that support stem-cell identity and differentiation.
      zh-CN: EZH1 与 EZH2 提供互补但不冗余的 H3K27 甲基化活性，共同维持干细胞身份并支持分化。
    tags:
      en: [EZH1, EZH2, H3K27 methylation, Pluripotency]
      zh-CN: [EZH1, EZH2, H3K27 甲基化, 多能性]
    figure:
      path: /images/publications/representative/2008-ezh1-ezh2-model.webp
      alt:
        en: Model comparing complementary EZH1 and EZH2 functions in H3K27 methylation, stem-cell identity, and differentiation.
        zh-CN: 模型比较 EZH1 与 EZH2 在 H3K27 甲基化、干细胞身份及分化中的互补功能。
      source:
        en: Figure 7 · Complementary but nonredundant roles of EZH1 and EZH2
        zh-CN: 图 7 · EZH1 与 EZH2 互补但不冗余的作用
  - publication_id: pub-cv-051
    category: foundations
    title: Complementary signaling pathways regulate the unfolded protein response and are required for C. elegans development
    venue: Cell
    year: 2001
    summary:
      en: Complementary unfolded protein response pathways are jointly required for C. elegans development, defining conserved logic in endoplasmic-reticulum stress signaling.
      zh-CN: 互补的未折叠蛋白反应通路共同保障秀丽隐杆线虫发育，揭示内质网应激信号的保守逻辑。
    tags:
      en: [Unfolded protein response, ER stress, C. elegans, Development]
      zh-CN: [未折叠蛋白反应, 内质网应激, 秀丽隐杆线虫, 发育]
    figure:
      path: /images/publications/representative/2001-upr-pathways-model.webp
      alt:
        en: Model comparing unfolded protein response pathways in C. elegans and budding yeast.
        zh-CN: 模型比较秀丽隐杆线虫与芽殖酵母中的未折叠蛋白反应通路。
      source:
        en: Figure 7 · Pathways that signal the unfolded protein response during development
        zh-CN: 图 7 · 发育过程中传递未折叠蛋白反应信号的通路

