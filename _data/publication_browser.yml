    title: Jumonji modulates Polycomb activity and self-renewal versus differentiation of stem cells
    venue: Cell
    year: 2009
    summary:
      en: Jumonji modulates PRC2 activity to balance embryonic stem-cell self-renewal and differentiation.
      zh-CN: Jumonji 调节 PRC2 活性，从而平衡胚胎干细胞的自我更新与分化。
    tags:
      en: [Jumonji, PRC2, Polycomb, Stem-cell fate]
