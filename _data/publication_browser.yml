representatives:
  - publication_id: pub-cv-013
    category: genome-organization
    title: Homotypic clustering of L1 and B1/Alu repeats compartmentalizes the 3D genome
    venue: Cell Research
    year: 2021
    summary:
      en: L1 and B1/Alu repeats form homotypic nuclear compartments that partition the 3D genome and coordinate gene regulation.
      zh-CN: L1 与 B1/Alu 重复序列形成同类聚集的核内区室，从而划分三维基因组并协调基因调控。
    tags:
      en: [L1 repeats, B1/Alu repeats, 3D genome, Genome compartmentalization]
      zh-CN: [L1 重复序列, B1/Alu 重复序列, 三维基因组, 基因组区室化]
    figure:
      path: /images/publications/representative/2021-l1-b1-dna-fish.webp
      alt:
        en: DNA FISH images showing spatial segregation of B1/Alu and L1 repeats in mammalian nuclei.
        zh-CN: DNA FISH 图像显示哺乳动物细胞核中 B1/Alu 与 L1 重复序列的空间分离。
      source:
        en: Figure 2 · DNA FISH reveals the spatial segregation of L1 and B1 compartments
        zh-CN: 图 2 · DNA FISH 显示 L1 与 B1 区室的空间分离
  - publication_id: pub-cv-016
    category: genome-organization
    title: Genomic repeats categorize genes with distinct functions for orchestrated regulation
    venue: Cell Reports
    year: 2020
    summary:
      en: Repeat classes act as genomic barcodes that group genes by function, developmental timing, and spatial organization.
      zh-CN: 不同重复序列类别如同基因组条形码，按照功能、发育时序与空间组织对基因进行分组。
    tags:
      en: [Genomic repeats, Gene regulation, Nuclear organization, Developmental timing]
      zh-CN: [基因组重复序列, 基因调控, 细胞核组织, 发育时序]
    figure:
      path: /images/publications/representative/2020-genomic-repeats-graphical-abstract.webp
      alt:
        en: Graphical abstract showing genomic repeats as barcodes for gene function, developmental timing, and nuclear organization.
        zh-CN: 图形摘要展示基因组重复序列如何编码基因功能、发育时序与细胞核组织。
      source:
        en: Graphical abstract · Repeat classes coordinate gene function and spatial organization
        zh-CN: 图形摘要 · 不同重复序列类别协调基因功能与空间组织
  - publication_id: pub-cv-005
    category: rna-networks
    title: Nuclear RNA homeostasis promotes systems-level coordination for cell fate and vitality
    venue: Cell Stem Cell
    year: 2024
    summary:
      en: Nuclear RNA homeostasis coordinates transcription, translation, chromatin organization, and cell-state programs, linking RNA exosome activity to cell fate and vitality.
      zh-CN: 核内 RNA 稳态协调转录、翻译、染色质组织与细胞状态程序，将 RNA 外切体活性与细胞命运及活力联系起来。
    tags:
      en: [Nuclear RNA homeostasis, RNA exosome, Chromatin organization, Cell fate]
      zh-CN: [核内 RNA 稳态, RNA 外切体, 染色质组织, 细胞命运]
    figure:
      path: /images/publications/representative/2024-nuclear-rna-homeostasis-graphical-abstract.webp
      alt:
        en: Graphical abstract linking RNA exosome activity, nuclear RNA homeostasis, transcription, translation, chromatin organization, and cell state.
        zh-CN: 图形摘要连接 RNA 外切体活性、核内 RNA 稳态、转录、翻译、染色质组织与细胞状态。
      source:
        en: Graphical abstract · Nuclear RNA homeostasis coordinates cell fate and senescence
        zh-CN: 图形摘要 · 核内 RNA 稳态协调细胞命运与衰老
  - publication_id: pub-cv-010
    category: rna-networks
    title: Phase separation of RNA-binding protein promotes polymerase engagement and transcription
    venue: Nature Chemical Biology
    year: 2022
    summary:
      en: RNA-binding proteins assemble transcriptional condensates at promoters and enhancers, promoting RNA polymerase II engagement and transcription.
      zh-CN: RNA 结合蛋白在启动子与增强子处组装转录凝聚体，促进 RNA 聚合酶 II 的招募与转录。
    tags:
      en: [Phase separation, RNA-binding proteins, RNA polymerase II, Transcription]
      zh-CN: [相分离, RNA 结合蛋白, RNA 聚合酶 II, 转录]
    figure:
      path: /images/publications/representative/2022-pspc1-transcription-condensate-model.webp
      alt:
        en: Model showing RNA-binding proteins assembling transcription condensates that recruit and activate RNA polymerase II.
        zh-CN: 模型展示 RNA 结合蛋白组装转录凝聚体并招募、激活 RNA 聚合酶 II。
      source:
        en: Figure 6e · Model of RNA-binding proteins at promoters and enhancers
        zh-CN: 图 6e · 启动子与增强子处 RNA 结合蛋白的作用模型
  - publication_id: pub-cv-015
    category: rna-networks
    title: U1 snRNP regulates chromatin retention of noncoding RNAs
    venue: Nature
    year: 2020
  - publication_id: pub-cv-025
    category: rna-networks
    title: RNA targets ribosome biogenesis factor WDR43 to chromatin for transcription and pluripotency control
    venue: Molecular Cell
    year: 2019
    summary:
      en: Nascent RNA recruits WDR43 to chromatin, coupling ribosome-biogenesis machinery to transcription elongation and pluripotency control.
      zh-CN: 新生 RNA 将 WDR43 招募至染色质，把核糖体生物发生机器与转录延伸及多能性调控联系起来。
    tags:
      en: [WDR43, Nascent RNA, Ribosome biogenesis, Pluripotency]
      zh-CN: [WDR43, 新生 RNA, 核糖体生物发生, 多能性]
    figure:
      path: /images/publications/representative/2019-wdr43-graphical-abstract.webp
      alt:
        en: Graphical abstract showing nascent RNA recruitment of WDR43 to chromatin and its role in transcription elongation.
        zh-CN: 图形摘要展示新生 RNA 将 WDR43 招募至染色质并调控转录延伸。
      source:
        en: Graphical abstract · Nascent RNA targets WDR43 to chromatin
        zh-CN: 图形摘要 · 新生 RNA 将 WDR43 靶向染色质
  - publication_id: pub-cv-024
    category: rna-networks
    title: The lncRNA Hand2os1/Uph locus orchestrates heart development through regulation of precise expression HAND2
    venue: Development
    year: 2019
    summary:
      en: The Hand2os1/Uph locus controls precise HAND2 expression; its deletion disrupts embryonic heart development and causes congenital cardiac defects.
      zh-CN: Hand2os1/Uph 位点精确调控 HAND2 表达；该位点缺失会扰乱胚胎心脏发育并导致先天性心脏缺陷。
    tags:
      en: [Hand2os1/Uph, lncRNA, Heart development, HAND2]
      zh-CN: [Hand2os1/Uph, lncRNA, 心脏发育, HAND2]
    figure:
      path: /images/publications/representative/2019-hand2os1-heart-phenotype.webp
      alt:
        en: Developmental and cardiac phenotypes caused by deletion of the Hand2os1 locus, with embryonic heart images and molecular analyses.
        zh-CN: Hand2os1 位点缺失导致的发育与心脏表型，包括胚胎心脏图像及分子分析。
      source:
        en: Figure 2 · Hand2os1 locus deletion causes congenital heart defects
        zh-CN: 图 2 · Hand2os1 位点缺失导致先天性心脏缺陷
  - publication_id: pub-cv-031
    category: rna-networks
    title: Divergent lncRNAs regulate gene expression and lineage differentiation in pluripotent cells
    venue: Cell Stem Cell
    year: 2016
    summary:
      en: Divergent lncRNAs act in cis to tune neighboring coding genes and influence lineage differentiation in pluripotent cells.
      zh-CN: 双向转录 lncRNA 通过顺式作用调节邻近编码基因，并影响多能细胞的谱系分化。
    tags:
      en: [Divergent lncRNAs, Cis regulation, Pluripotency, Lineage differentiation]
      zh-CN: [双向转录 lncRNA, 顺式调控, 多能性, 谱系分化]
    figure:
      path: /images/publications/representative/2016-divergent-lncrnas-graphical-abstract.webp
      alt:
        en: Graphical abstract showing divergent lncRNAs acting in cis to regulate nearby coding genes and developmental processes.
        zh-CN: 图形摘要展示双向转录 lncRNA 通过顺式作用调控邻近编码基因与发育过程。
      source:
        en: Graphical abstract · Divergent lncRNAs regulate adjacent genes in cis
        zh-CN: 图形摘要 · 双向转录 lncRNA 顺式调控邻近基因
  - publication_id: pub-cv-032
    category: rna-networks
    title: Opposing roles for the lncRNA Haunt and its genomic locus in regulating HOXA gene activation during embryonic stem cell differentiation
    venue: Cell Stem Cell
    year: 2015
    summary:
      en: The Haunt RNA and its genomic locus exert opposing effects on HOXA activation during embryonic stem-cell differentiation.
      zh-CN: Haunt RNA 与其基因组位点在胚胎干细胞分化过程中对 HOXA 激活产生相反作用。
    tags:
      en: [Haunt, HOXA, lncRNA, Stem-cell differentiation]
      zh-CN: [Haunt, HOXA, lncRNA, 干细胞分化]
    figure:
      path: /images/publications/representative/2015-haunt-graphical-abstract.webp
      alt:
        en: Graphical abstract showing opposing enhancer and RNA functions at the Haunt locus during HOXA activation.
        zh-CN: 图形摘要展示 Haunt 位点在 HOXA 激活过程中相反的增强子与 RNA 功能。
      source:
        en: Graphical abstract · Opposing RNA and DNA functions at the Haunt locus
        zh-CN: 图形摘要 · Haunt 位点中 RNA 与 DNA 的相反作用
