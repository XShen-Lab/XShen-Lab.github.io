  title: U1 snRNP regulates chromatin retention of noncoding RNAs
  authors: Yafei Yin, J. Yuyang Lu, Xuechun Zhang, Wen Shao, Yanhui Xu, Pan Li, Yantao Hong, Li Cui, Ge Shan, Bin Tian, Qiangfeng Cliff Zhang, and Xiaohua Shen
  venue: Nature
  volume: "580"
  pages: 147–150
  year: 2020
  doi: 10.1038/s41586-020-2105-3
  article_url: https://doi.org/10.1038/s41586-020-2105-3
