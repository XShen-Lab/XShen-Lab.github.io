{% assign publication = include.publication %}
{% if publication.links.article %}
  <ul>
    <li><a href="{{ publication.links.article }}">View article</a></li>
  </ul>
{% endif %}

{% if publication.links.data.size > 0 %}
  <h2 id="data">Data</h2>

  <ul>
    {% for dataset in publication.links.data %}
      <li>
        <p><a href="{{ dataset.url }}">{{ dataset.label }}</a></p>
      </li>
    {% endfor %}
  </ul>
{% endif %}
